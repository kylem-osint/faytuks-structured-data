services:
  db:
    image: mysql:8.4
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fn_structured_data_test_db_data:/var/lib/mysql

volumes:
  fn_structured_data_test_db_data:
