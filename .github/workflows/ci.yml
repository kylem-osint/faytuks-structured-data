name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      # --no-check-publish because the "version" field is deliberately kept as a
      # version-sync source, matching FN Live. The plugin ships as a release ZIP
      # and is never published to Packagist.
      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

      - name: PHPStan
        run: composer analyse

  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: composer test:unit:report

      # Uploaded even on failure so the report job can show which tests broke.
      # Only the production runtime's results are published: every matrix entry
      # runs the same tests and would write the same file names, so uploading
      # all of them would either collide on the artifact name or let whichever
      # job finished last decide what the report shows.
      - name: Upload unit results
        if: always() && matrix.php == '8.3'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: mysqli
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install WordPress test suite
        run: composer test:integration:install
        env:
          WP_TEST_DB_HOST: 127.0.0.1:3308

      - name: Normalize test config
        run: composer test:integration:prepare

      - name: Integration tests
        run: composer test:integration:report

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [test, integration]
    # Runs even when a suite fails, because a red PR is exactly when the
    # comment is worth reading.
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # merge-multiple lets both suites land in one coverage/ directory, which
      # is the layout test-report.js expects locally too.
      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: true
          path: coverage
        continue-on-error: true

      - name: Render report
        run: node .github/scripts/test-report.js --output coverage/report.md

      - name: Add report to job summary
        run: cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"

      # Skipped for forks, where pull_request runs get a read-only token and
      # the API call would fail no matter what permissions are requested.
      - name: Comment on pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage/report.md', 'utf8');
            const marker = '<!-- fn-structured-data:test-report -->';

            // Paginated so a long-running PR cannot push the existing report
            // past the first page, which would post a duplicate every run.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  build:
    name: Build and package verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install Node dependencies
        run: npm ci

      - name: Verify version synchronization
        run: npm run verify-version

      - name: Verify update source matches this repository
        run: npm run verify-update-source

      # semantic-release only renders notes once it decides to publish, so this
      # renders them up front. Without it, an incompatible changelog preset only
      # shows up by failing the release itself.
      - name: Verify release notes pipeline
        run: npm run verify-release-notes

      - name: JavaScript syntax check
        run: npm run lint:js

      - name: Install PHP production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build and verify plugin package
        run: npm run build:notest

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: fn-structured-data-package
          path: dist/fn-structured-data-*.zip
          if-no-files-found: error

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
