# Dependency pull requests target staging rather than the default branch, so
# they land where the rest of the work is integrated and reach main through the
# same staging -> main merge as everything else. Note that Dependabot *security*
# updates ignore target-branch and always open against the default branch.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The changelog preset is coupled to conventional-changelog-writer, which
      # semantic-release pins transitively. Preset 10 requires writer 9, while
      # @semantic-release/release-notes-generator 14 still depends on writer 8,
      # and taking that major broke the 1.0.0 release. Only lift this once
      # semantic-release ships a release-notes-generator built on writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
